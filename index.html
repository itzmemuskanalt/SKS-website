<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SKS Agro Engineers | Product Catalogue</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7f4;
            color: #222;
        }

        /* HEADER */
        header {
            background: #ffffff;
            border-bottom: 1px solid #ddd;
            padding: 18px 6%;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 65px;
            height: 65px;
            object-fit: contain;
        }

        .company-name h1 {
            font-size: 25px;
            color: #245c35;
        }

        .company-name p {
            color: #666;
            margin-top: 4px;
            font-size: 14px;
        }

        /* HERO */
        .hero {
            background: linear-gradient(135deg, #245c35, #4d8b50);
            color: white;
            text-align: center;
            padding: 55px 20px;
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 17px;
            opacity: 0.95;
        }

        /* SEARCH */
        .search-section {
            max-width: 1100px;
            margin: 30px auto 15px;
            padding: 0 20px;
        }

        #searchBox {
            width: 100%;
            padding: 16px 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        #searchBox:focus {
            border-color: #4d8b50;
        }

        /* CATEGORY BUTTONS */
        .categories {
            max-width: 1100px;
            margin: 15px auto 30px;
            padding: 0 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 10px 18px;
            border: 1px solid #4d8b50;
            background: white;
            color: #245c35;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .category-btn:hover,
        .category-btn.active {
            background: #245c35;
            color: white;
        }

        /* PRODUCTS */
        .products {
            max-width: 1100px;
            margin: auto;
            padding: 0 20px 50px;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 22px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e2e2;
            transition: 0.25s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.10);
        }

        .product-image {
            width: 100%;
            height: 220px;
            object-fit: contain;
            background: #fafafa;
            padding: 15px;
        }

        .product-info {
            padding: 18px;
        }

        .product-info h3 {
            color: #245c35;
            margin-bottom: 10px;
            font-size: 19px;
        }

        .product-info p {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 6px;
        }

        .label {
            font-weight: bold;
            color: #333;
        }

        /* FOOTER */
        footer {
            background: #1f2d22;
            color: white;
            text-align: center;
            padding: 25px 15px;
            font-size: 14px;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            header {
                padding: 15px 20px;
            }

            .logo {
                width: 50px;
                height: 50px;
            }

            .company-name h1 {
                font-size: 19px;
            }

            .hero {
                padding: 40px 15px;
            }

            .hero h2 {
                font-size: 28px;
            }

            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>

        <!-- Apna logo yahan images/sks-logo.png naam se upload karna -->
        <img src="images/sks-logo.png" class="logo" alt="SKS Agro Engineers Logo">

        <div class="company-name">
            <h1>SKS Agro Engineers</h1>
            <p>Agro Engineering Products</p>
        </div>

    </header>


    <!-- HERO -->
    <section class="hero">
        <h2>Product Catalogue</h2>
        <p>Explore our agricultural machinery, components and spare parts.</p>
    </section>


    <!-- SEARCH -->
    <section class="search-section
